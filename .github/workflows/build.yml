name: Build Grand Inventory System

on:
  workflow_dispatch:
  push:
    paths:
      - 'GrandInventorySystem-Source-1.0.1.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract Source
        run: unzip -q GrandInventorySystem-Source-1.0.1.zip -d source

      - name: Build Plugin
        run: mvn -B -f source/GrandInventorySystem/pom.xml clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GrandInventorySystem
          path: source/GrandInventorySystem/target/*.jar
